<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Castle of Infinite Worlds</title>
<style>
  body {
    background: linear-gradient(#1a1a2e, #16213e);
    color: #fff;
    font-family: 'Georgia', serif;
    padding: 40px;
  }
  h1 {
    text-align: center;
    font-size: 3rem;
    color: #f8e9a1;
    text-shadow: 0 0 10px #f9d342;
  }
  .castle {
    border: 2px solid #f9d342;
    padding: 20px;
    margin-top: 30px;
    background: rgba(255,255,255,0.1);
  }
  .magic-btn {
    background: #e94560;
    padding: 15px 25px;
    border: none;
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
    margin-top: 20px;
  }
</style>
</head>
<body>

<h1>The Castle of Infinite Worlds</h1>

<div class="castle">
  <p>In the heart of Disneyland, a hidden chamber awakens during the holidays. 
  Sailor Moon’s moonlight mixes with Superman’s strength, while Jack Skellington 
  dances through peppermint snow.</p>

  <p>Lex Luthor steps through the portal, determined to control creativity itself.</p>

  <button class="magic-btn" onclick="activateMagic()">Activate Castle Magic</button>
</div>

<script>
function activateMagic() {
  alert("Moonlight, gingerbread, and cosmic energy swirl around you!");
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Cooking Recipes & Oven</title>
  <style>
    body { font-family: sans-serif; background: #fffaf0; margin: 0; padding: 20px; }
    .layout { display: flex; gap: 30px; }
    .oven {
      width: 250px;
      height: 350px;
      background: #ddd;
      border-radius: 10px;
      border: 3px solid #555;
      position: relative;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }
    .oven-door {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      height: 180px;
      background: #f0f0f0;
      border: 2px solid #666;
      border-radius: 6px;
    }
    .oven-window {
      margin: 20px;
      height: 120px;
      background: #cce0ff;
      border-radius: 4px;
    }
    .controls {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
    }
    .knob {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #666;
      border: 2px solid #333;
    }
    .recipes h2 { margin-top: 0; }
    .recipe { margin-bottom: 15px; }
    .recipe-title { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Kitchen Recipes</h1>
  <div class="layout">
    <div class="oven">
      <div class="controls">
        <div class="knob"></div>
        <div class="knob"></div>
        <div class="knob"></div>
      </div>
      <div class="oven-door">
        <div class="oven-window"></div>
      </div>
    </div>

    <div class="recipes">
      <h2>Favorite Recipes</h2>

      <div class="recipe">
        <div class="recipe-title">Chocolate Chip Cookies</div>
        <div>Temp: 350°F · Time: 12–15 min</div>
        <ul>
          <li>Flour, sugar, butter, eggs, chocolate chips</li>
          <li>Mix, scoop, bake until golden</li>
        </ul>
      </div>

      <div class="recipe">
        <div class="recipe-title">Lasagna</div>
        <div>Temp: 375°F · Time: 45–60 min</div>
        <ul>
          <li>Pasta sheets, sauce, cheese, meat/veggies</li>
          <li>Layer, cover, bake until bubbly</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
